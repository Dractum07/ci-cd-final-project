apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: cleanup
spec:
  description: Clean the source workspace before the pipeline starts.
  params:
    - name: WORKSPACE_SOURCE_PATH
      type: string
      description: Path inside the source workspace to clean.
      default: "."
  workspaces:
    - name: source
  steps:
    - name: remove
      image: alpine:3.20
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu

        if [ -d "$(params.WORKSPACE_SOURCE_PATH)" ]; then
          rm -rf "$(params.WORKSPACE_SOURCE_PATH)"/*
          rm -rf "$(params.WORKSPACE_SOURCE_PATH)"/.[!.]*
          rm -rf "$(params.WORKSPACE_SOURCE_PATH)"/..?*
        fi
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: nose
spec:
  description: Run Python unit tests with Nose.
  params:
    - name: args
      description: Arguments passed to nosetests.
      type: string
      default: "-v"
  workspaces:
    - name: source
  steps:
    - name: nosetests
      image: python:3.9-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/bash
        set -eu

        python -m pip install --upgrade pip wheel
        pip install -r requirements.txt
        pip install nose
        nosetests $(params.args)
